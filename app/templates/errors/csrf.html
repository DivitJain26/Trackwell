{% extends "base.html" %}
{% block title %}Form expired{% endblock %}
{% block content %}
<div class="card"><div class="card-body empty-state">
  <i class="bi bi-shield-exclamation"></i>
  <div class="h5 text-body">The form could not be submitted</div>
  <p class="mb-3">The security token was missing or invalid ({{ reason }}). Please go back, reload the page and try again.</p>
  <a class="btn btn-outline-primary btn-sm" href="{{ url_for('main.index') }}">Go to home page</a>
</div></div>
{% endblock %}
